<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ログイン — kaiun-map</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <p class="kicker">Japan &amp; world shipping</p>
      <h1>kaiun-map</h1>
      <p class="lede">ログインするとプロジェクトが保存されます。未ログインでも地図は使えますが、作ったプロジェクトはブラウザを閉じると消えます。</p>
      <p class="hint"><a href="/">ログインせず地図を見る</a></p>
      <form id="auth-form">
        <label class="field">ユーザーID
          <input name="user_id" autocomplete="username" required minlength="3" maxlength="32" />
        </label>
        <label class="field">パスワード
          <input name="password" type="password" autocomplete="current-password" required minlength="8" />
        </label>
        <label class="field">属性（新規登録時は必須）
          <select name="role" id="role-select">
            <option value="">選んでください</option>
          </select>
        </label>
        <label class="field">会社・部署（任意）
          <input name="company" maxlength="80" placeholder="例: ○○商事 物流部" />
        </label>
        <p class="hint">属性は AI が「あなたは船会社です」のように裏で役割を固定し、実務目線の回答に使います。ログイン時は不要です。</p>
        <p class="ai-note" id="auth-note"></p>
        <div class="row">
          <button type="submit" id="login-btn">ログイン</button>
          <button type="button" class="ghost" id="register-btn">新規登録</button>
        </div>
      </form>
    </main>
    <script>
      const note = document.getElementById("auth-note");
      const form = document.getElementById("auth-form");
      async function loadRoles() {
        const res = await fetch("/api/auth/roles");
        const data = await res.json();
        const sel = document.getElementById("role-select");
        for (const role of data.roles || []) {
          const opt = document.createElement("option");
          opt.value = role.id;
          opt.textContent = role.label;
          sel.appendChild(opt);
        }
      }
      async function send(path) {
        const body = Object.fromEntries(new FormData(form).entries());
        if (path.endsWith("/register") && !body.role) {
          note.textContent = "属性を選んでください。";
          return;
        }
        if (path.endsWith("/login")) {
          delete body.role;
          delete body.company;
        }
        note.textContent = "送信中…";
        const res = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) {
          note.textContent = data.detail || "失敗しました";
          return;
        }
        location.href = "/";
      }
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        send("/api/auth/login");
      });
      document.getElementById("register-btn").addEventListener("click", () => send("/api/auth/register"));
      loadRoles();
    </script>
  </body>
</html>
